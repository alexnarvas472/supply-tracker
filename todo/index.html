<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do Checklist</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f5fa8">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f6; color: #222; }
    .card { max-width: 440px; margin: 40px auto; background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    label { display: block; font-size: 14px; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 11px; font-size: 16px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 16px; width: 100%; padding: 13px; font-size: 16px; border: 0; border-radius: 8px; background: #1f5fa8; color: #fff; }
    #pa-err { color: #b00020; font-size: 14px; margin-top: 10px; min-height: 1em; }
    #pa-loading { text-align: center; margin-top: 30vh; color: #555; }
  </style>
</head>
<body>
  <div id="pa-loading"><img src="icon-192.png" width="72" height="72" alt=""><p id="pa-msg">Loading…</p></div>

  <div id="pa-setup" class="card" style="display:none">
    <h2 style="margin-top:0">Set up</h2>
    <p style="font-size:14px;color:#555">You only do this once on this phone.</p>
    <label for="pa-url">Apps Script web app URL (ends in /exec)</label>
    <input id="pa-url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="pa-key">Key</label>
    <input id="pa-key" type="password" autocomplete="off">
    <div id="pa-err"></div>
    <button id="pa-go">Connect</button>
  </div>

  <script src="app-config.js"></script>
  <script src="shim.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    window.__pa.boot();
  </script>
</body>
</html>
