<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex's apps</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f6; color: #222; }
    .wrap { max-width: 460px; margin: 30px auto; }
    a.app { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 14px; padding: 16px;
      margin: 12px 0; text-decoration: none; color: inherit; box-shadow: 0 2px 10px rgba(0,0,0,.08); font-size: 19px; font-weight: 600; }
    a.app img { width: 52px; height: 52px; border-radius: 12px; }
    p { color: #555; line-height: 1.45; }
  </style>
  <script>
    // Remove the old site-wide offline worker (each app has its own now).
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</head>
<body>
  <div class="wrap">
    <h2>Your apps</h2>
    <a class="app" href="supplies/"><img src="supplies/icon-192.png" alt="">Home Supply Tracker</a>
    <a class="app" href="todo/"><img src="todo/icon-192.png" alt="">To-Do Checklist</a>
    <p>Open one, then tap <b>⋮ → Install app</b> in Chrome.</p>
    <p style="font-size:14px">Had the old “Supplies” app installed? Uninstall it (long-press its icon → App info → Uninstall),
      then install Home Supply Tracker again from here. Your URL and key are remembered.</p>
  </div>
</body>
</html>
