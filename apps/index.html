<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Apps</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#3b3fb6">
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f3f4f8; color: #1d1f29; font-size: 17px; }
    header { background: #3b3fb6; color: #fff; padding: 22px 18px 18px; }
    header h1 { margin: 0; font-size: 26px; }
    header p { margin: 4px 0 0; opacity: .85; font-size: 15px; }
    main { max-width: 560px; margin: 0 auto; padding: 14px; }
    .tile { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px;
      margin: 10px 0; box-shadow: 0 1px 6px rgba(0,0,0,.08); cursor: pointer; }
    .tile .ico { font-size: 34px; width: 54px; height: 54px; border-radius: 14px; background: #eef0ff; display: grid; place-items: center; flex: none; }
    .tile .txt { flex: 1; min-width: 0; }
    .tile .name { font-weight: 650; font-size: 18px; overflow-wrap: anywhere; }
    .tile .sub { font-size: 13px; color: #6b6f80; margin-top: 2px; }
    .tile .sub.warn { color: #9a5b00; }
    .tile .more { background: none; border: 0; font-size: 24px; padding: 6px 10px; color: #6b6f80; cursor: pointer; }
    button.big { width: 100%; padding: 14px; font-size: 17px; border-radius: 12px; border: 2px dashed #b9bce6; background: #fff; color: #3b3fb6; font-weight: 600; margin-top: 8px; cursor: pointer; }
    dialog { border: 0; border-radius: 18px; padding: 20px; width: min(94vw, 460px); }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    label { display: block; font-size: 14px; margin: 12px 0 4px; color: #444; }
    input, select { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #c9cbd6; border-radius: 10px; }
    .row { display: flex; gap: 8px; margin-top: 16px; }
    .row button { flex: 1; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #c9cbd6; background: #fff; cursor: pointer; }
    .row button.primary { background: #3b3fb6; color: #fff; border-color: #3b3fb6; }
    .row button.danger { color: #b00020; }
    #err { color: #b00020; font-size: 14px; min-height: 1.2em; margin-top: 8px; }
    .help { font-size: 13px; color: #6b6f80; line-height: 1.45; }
    #pa-loading { text-align: center; margin-top: 30vh; color: #555; }
    .empty { text-align: center; color: #6b6f80; padding: 30px 10px; }
  </style>
</head>
<body>
  <div id="pa-loading" hidden><img src="icon-192.png" width="72" height="72" alt=""><p id="pa-msg">Opening…</p><p><a href="./">⌂ Back to My Apps</a></p></div>

  <div id="hub" hidden>
    <header><h1>My Apps</h1><p id="hubSub">Your Apps Script apps</p></header>
    <main>
      <div id="tiles"></div>
      <button class="big" id="addBtn">＋ Add app</button>
      <p class="help" style="margin-top:18px">To add an app: put <b>MyAppsConnector.js</b> in that Apps Script project,
        run <b>setupPhoneApi</b> once (copy the key from the log), then Deploy → New deployment → Web app,
        Execute as Me, access <b>Anyone</b>, and copy its /exec URL.</p>
    </main>
  </div>

  <dialog id="dlg">
    <h2 id="dlgTitle" style="margin:0">Add app</h2>
    <label for="fName">Name</label><input id="fName" placeholder="e.g. Where My Time Went">
    <label for="fType">Kind of app</label><select id="fType"></select>
    <label for="fUrl">Web app URL (ends in /exec)</label><input id="fUrl" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="fKey">Key</label><input id="fKey" type="password" autocomplete="off">
    <div id="err"></div>
    <div class="row"><button id="dlgCancel">Cancel</button><button id="dlgSave" class="primary">Test &amp; save</button></div>
    <div class="row" id="dlgDangerRow"><button id="dlgRemove" class="danger">Remove from My Apps</button></div>
  </dialog>

  <script src="app-types.js"></script>
  <script src="shim.js"></script>
  <script>
  // Everything inside a function, so names here can't clash with an app's own code.
  (function () {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    const LIST_KEY = "myapps:list";
    const get = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
    const set = (k, v) => localStorage.setItem(k, JSON.stringify(v));
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    if (params.get("app")) {
      $("pa-loading").hidden = false;
      window.__pa.openApp();
    } else {
      $("hub").hidden = false;
      renderHub();
    }

    function ago(t) {
      if (!t) return "";
      const m = Math.round((Date.now() - t) / 60000);
      if (m < 1) return "just now";
      if (m < 60) return m + " min ago";
      const h = Math.round(m / 60);
      if (h < 24) return h + " h ago";
      return new Date(t).toLocaleDateString([], { month: "short", day: "numeric" });
    }

    function renderHub() {
      const list = get(LIST_KEY, []);
      const types = window.MYAPPS_TYPES;
      $("tiles").replaceChildren();
      $("hubSub").textContent = navigator.onLine ? "Your Apps Script apps" : "Offline · apps open from their saved copy";
      if (!list.length) {
        const e = document.createElement("div"); e.className = "empty";
        e.textContent = "No apps yet. Tap ＋ Add app.";
        $("tiles").append(e);
      }
      list.forEach(a => {
        const t = types[a.type] || types.generic;
        const waiting = get("myapps:" + a.id + ":queue", []).length;
        const synced = get("myapps:" + a.id + ":lastSync", 0);
        const tile = document.createElement("div"); tile.className = "tile";
        const ico = document.createElement("div"); ico.className = "ico"; ico.textContent = a.icon || t.icon || "📱";
        const txt = document.createElement("div"); txt.className = "txt";
        const name = document.createElement("div"); name.className = "name"; name.textContent = a.name;
        const sub = document.createElement("div"); sub.className = "sub" + (waiting ? " warn" : "");
        sub.textContent = waiting ? waiting + " change(s) waiting to sync"
          : (get("myapps:" + a.id + ":ui", null) ? "Ready offline" + (synced ? " · updated " + ago(synced) : "") : "Open once with internet to save offline");
        txt.append(name, sub);
        const more = document.createElement("button"); more.className = "more"; more.textContent = "⋯"; more.title = "Edit";
        more.onclick = e => { e.stopPropagation(); openDialog(a); };
        tile.append(ico, txt, more);
        tile.onclick = () => { location.href = "./?app=" + encodeURIComponent(a.id); };
        $("tiles").append(tile);
      });
    }

    let editing = null;
    function openDialog(a) {
      editing = a || null;
      const types = window.MYAPPS_TYPES;
      $("fType").replaceChildren(...Object.keys(types).map(k => new Option(types[k].icon + " " + types[k].label, k)));
      $("dlgTitle").textContent = a ? "Edit " + a.name : "Add app";
      $("fName").value = a ? a.name : "";
      $("fType").value = a ? a.type : "generic";
      $("fUrl").value = a ? a.url : "";
      $("fKey").value = a ? a.key : "";
      $("err").textContent = "";
      $("dlgDangerRow").hidden = !a;
      $("dlg").showModal();
    }
    $("addBtn").onclick = () => openDialog(null);
    $("dlgCancel").onclick = () => $("dlg").close();
    $("dlgRemove").onclick = () => {
      if (!editing) return;
      const waiting = get("myapps:" + editing.id + ":queue", []).length;
      if (!confirm("Remove " + editing.name + " from My Apps on this phone?" +
        (waiting ? "\n\nIt still has " + waiting + " change(s) that haven't synced — they'd be lost." : "") +
        "\n\n(The app itself and its data in Google are not affected.)")) return;
      Object.keys(localStorage).filter(k => k.startsWith("myapps:" + editing.id + ":")).forEach(k => localStorage.removeItem(k));
      set(LIST_KEY, get(LIST_KEY, []).filter(x => x.id !== editing.id));
      $("dlg").close(); renderHub();
    };
    $("dlgSave").onclick = async () => {
      const name = $("fName").value.trim(), url = $("fUrl").value.trim(), key = $("fKey").value.trim(), type = $("fType").value;
      if (!name) return ($("err").textContent = "Give the app a name.");
      if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(url)) return ($("err").textContent = "Paste the web app URL from Apps Script — it ends in /exec.");
      if (!key) return ($("err").textContent = "Paste the key from setupPhoneApi.");
      $("err").textContent = "Checking…"; $("dlgSave").disabled = true;
      try {
        const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ key, fn: "__ping" }) });
        const data = await res.json();
        if (data.auth === false) throw new Error("That key was rejected. Run setupPhoneApi in that project and copy the key again.");
        if (!data.ok) throw new Error(data.error && /Unknown action/.test(data.error) ? "That app doesn't have MyAppsConnector.js yet (or it isn't deployed)." : data.error);
        const list = get(LIST_KEY, []);
        if (editing) Object.assign(list.find(x => x.id === editing.id), { name, url, key, type });
        else list.push({ id: Date.now().toString(36), name, url, key, type });
        set(LIST_KEY, list);
        $("dlg").close(); renderHub();
      } catch (e) {
        $("err").textContent = e instanceof TypeError ? "Couldn't reach it. Check the URL, and that the deployment's access is 'Anyone'." : e.message;
      } finally { $("dlgSave").disabled = false; }
    };
    window.addEventListener("online", () => !params.get("app") && renderHub());
    window.addEventListener("offline", () => !params.get("app") && renderHub());
  })();
  </script>
</body>
</html>
